name: CD_DOCKER_IMAGE (backend) (production)

on:
  push:
   branches: [production]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          build-args: |
            DATABASE_URL=${{ secrets.MONGODB_URL }}
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: devkmandal0/excallidraw_backend:${{ github.sha }}



      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            docker pull devkmandal0/excallidraw_backend:${{ github.sha }}

            docker stop excallidraw_backend || true
            docker rm excallidraw_backend || true

            docker run -d \
              --name excallidraw_backend \
              -p 8080:8080 \
              --restart unless-stopped \
              devkmandal0/excallidraw_backend:${{ github.sha }}

            docker image prune -af