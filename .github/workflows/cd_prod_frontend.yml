name: CD_DOCKER_IMAGE (frontend) (production)

on:
  push:
   branches: [production]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: true
          tags: devkmandal0/excallidraw_frontend:${{ github.sha }}


      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            docker pull devkmandal0/excallidraw_frontend:${{ github.sha }}

            docker stop excallidraw_frontend || true
            docker rm excallidraw_frontend || true

            docker run -d \
              --name excallidraw_frontend \
              -p 3000:3000 \
              --restart unless-stopped \
              devkmandal0/excallidraw_frontend:${{ github.sha }}

            docker image prune -af